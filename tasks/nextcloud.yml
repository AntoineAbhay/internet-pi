---
- name: Create Nextcloud folder on Pi.
  ansible.builtin.file:
    path: "{{ config_dir }}/next-cloud"
    state: directory
    mode: 0755
  become: false

- name: Copy Nextcloud docker-compose template to Pi.
  ansible.builtin.template:
    src: templates/nextcloud-docker-compose.yml.j2
    dest: "{{ config_dir }}/next-cloud/docker-compose.yml"
    mode: '0640'
  become: false
  notify: Restart nextcloud

- name: Ensure Nextcloud is running.
  community.docker.docker_compose_v2:
    project_src: "{{ config_dir }}/next-cloud/"
    build: never
  become: false
