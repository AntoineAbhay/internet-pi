---
- name: Create Traefik folder on Pi.
  ansible.builtin.file:
    path: "{{ config_dir }}/traefik"
    state: directory
    mode: 0755
  become: false

- name: Create Traefik config folder on Pi.
  ansible.builtin.file:
    path: "{{ config_dir }}/traefik/config"
    state: directory
    mode: 0755
  become: false

- name: Create Traefik letsencrypt folder on Pi.
  ansible.builtin.file:
    path: "{{ config_dir }}/traefik/letsencrypt"
    state: directory
    mode: 0755
  become: false

- name: Copy Traefik static configuration to Pi.
  ansible.builtin.template:
    src: templates/traefik.yml.j2
    dest: "{{ config_dir }}/traefik/config/traefik.yml"
    mode: '0644'
  become: false
  notify: Restart traefik

- name: Copy Traefik dynamic configuration to Pi.
  ansible.builtin.template:
    src: templates/dynamic.yml.j2
    dest: "{{ config_dir }}/traefik/config/dynamic.yml"
    mode: '0644'
  become: false
  notify: Restart traefik

- name: Copy Traefik docker-compose template to Pi.
  ansible.builtin.template:
    src: templates/traefik-docker-compose.yml.j2
    dest: "{{ config_dir }}/traefik/docker-compose.yml"
    mode: '0640'
  become: false
  notify: Restart traefik

# TODO: The first time this playbook is run, the `pi` user may not be added
# to the `docker` group, so this task may fail.
- name: Ensure Traefik is running.
  community.docker.docker_compose:
    project_src: "{{ config_dir }}/traefik/"
    build: false
  become: false
