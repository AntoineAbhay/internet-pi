---
# Location where configuration files will be stored.
config_dir: '~'

# Nextcloud configuration.
nextcloud_enable: false
nextcloud_datadir: /mnt/data/ncdata
nextcloud_mount: /mnt/data
nextcloud_apache_port: 11000

# Pi-hole configuration.
pihole_enable: true
pihole_hostname: pihole
pihole_timezone: America/Chicago
pihole_password: "change-this-password"
pihole_dhcp_port: true

# Internet monitoring configuration.
monitoring_enable: true
monitoring_grafana_admin_password: "admin"
monitoring_speedtest_interval: 60m
monitoring_ping_interval: 5s
prometheus_data_dir: ""
atmosphere_enable: false
atmosphere_target: "192.168.8.3:5000"
monitoring_ping_hosts:  # [URL];[HUMAN_READABLE_NAME]
  - http://www.google.com/;google.com
  - https://github.com/;github.com
  - https://www.apple.com/;apple.com

# Shelly Plug configuration. (Also requires `monitoring_enable`)
shelly_plug_enable: false
shelly_plug_hostname: my-shelly-plug-host-or-ip
shelly_plug_http_username: username
shelly_plug_http_password: "password"

# AirGradient configuration. (Also requires `monitoring_enable`)
airgradient_enable: false
airgradient_sensors:
  # ID Should be limited to no more than 38 characters, in the set a-z.
  - id: livingroom
    ip: "192.168.0.123"
    port: 9925

# Starlink configuration. (Also requires `monitoring_enable`)
starlink_enable: false

# Wireguard config
wireguard_enable: false
wireguard_peers:
  - name: antoine-mbp
    has_lan_access: false
  - name: antoine-phone
    has_lan_access: true
wireguard_port: 51820

internet_monitoring:
  expose_port: false

# Unbound config
unbound:
  port: 5053
  use_caps_for_id: "no"

my_domain: "example.com"

dns_challenge:
  provider: "ovh"
  email: "your-email@example.com"
  env:
    OVH_APPLICATION_KEY: "XXX"
    OVH_APPLICATION_SECRET: "XXX"
    OVH_CONSUMER_KEY: "XXX"
    OVH_ENDPOINT: "ovh-eu"

# Home Assistant configuration.
homeassistant_enable: false
homeassistant_hostname: homeassistant
homeassistant_timezone: "Europe/Paris"
# Expose port 8123 directly on host (default: true). Required for initial setup
# and onboarding to configure reverse proxy trust in Settings -> System -> Network.
# Once configured, set to false to route exclusively through Traefik.
homeassistant_expose_port: true
